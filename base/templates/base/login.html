{% extends 'base/base.html' %}
{% block body %}

<body>
    <div class="login-box">
        <h2>Time Study System</h2>
        <form method="POST">
            {% csrf_token %}
            <label>Email</label>
            <input type="email" name="email" required><br><br>
            <label>Password</label><br>
            <input type="password" name="password" required><br><br>
            <button type="submit">Login</button><br><br>
            <label>New User ? <a href="{% url 'register_user' %}">Register</a></label>
        </form>
    </div>
</body>
</html>

{% endblock %}
